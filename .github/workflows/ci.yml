name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Dead option audit
        run: pnpm audit-options

      - name: Build
        run: pnpm build

      - name: Built output shape
        run: pnpm check-dist

      - name: Bundle size
        run: node scripts/measure.mjs

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright's own Chromium, pinned to the installed @playwright/test.
      # Screenshot comparison is only meaningful against a fixed browser build.
      # The examples load dist/stipple.global.js by relative path, so the
      # script-tag build has to exist before the server can serve it.
      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression
        run: pnpm visual

      # The diff images are the whole point when this fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: visual/.results/
          retention-days: 7
          # An assertion failure writes no diff images, and an empty upload is
          # not worth a warning on an already-red run.
          if-no-files-found: ignore
